
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Planner 2026-2027</title>
    <link rel="stylesheet" href="pstyle.css">
</head>
<body>

    <main class="planner-cover">

        <div class="top-wave"></div>
        <div class="bottom-wave"></div>

        <div class="quote">
            SMALL STEPS<br>
            LEAD TO<br>
            BIG DREAMS
            <span>♡</span>
        </div>

        <div class="decoration decoration-top">✦</div>
        <div class="decoration decoration-left">✧</div>
        <div class="decoration decoration-right">✦</div>

        <section class="title-section">
            <div class="graduation-cap">🎓</div>

            <p class="student-title">S T U D E N T</p>

            <h1>Planner</h1>

            <div class="underline"></div>

            <p class="school-year">2026 – 2027</p>

            <p class="tagline">PLAN <span>✦</span> STUDY <span>✦</span> GROW</p>
        </section>

        <section class="student-details">
            <label for="studentName">NAME:</label>
            <input id="studentName"
                   type="text"
                   placeholder="Enter your name">

            <label for="studentCourse">COURSE:</label>
            <input id="studentCourse"
                   type="text"
                   placeholder="Enter your course">
        </section>

        <div class="leaf leaf-one">❧</div>
        <div class="leaf leaf-two">❧</div>

        <p class="footer-text">YOUR JOURNEY STARTS HERE</p>

    </main>

    <div class="controls">
        <button id="printButton">Print / Save as PDF</button>
    </div>

    <script src="planner.js"></script>
</body>
</html>
